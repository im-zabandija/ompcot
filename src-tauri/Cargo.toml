[package]
name = "ompcot"
version = "0.5.1"
description = "Omp Agent Desktop - session manager for omp coding agent"
authors = ["ZephyrQ"]
edition = "2021"

[[bin]]
name = "ompcot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "devtools", "macos-private-api", "tray-icon"] }
# The plugin defaults to `gtk3`, which makes rfd drive GTK3 directly. Under
# Wayland compositors that chooser never maps a window and the picker resolves
# to "cancelled", so "Open folder" silently does nothing. `xdg-portal` routes
# through xdg-desktop-portal instead (the same path zenity/GTK apps take) and
# is a no-op on macOS/Windows, which use their native backends.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-mcp-bridge = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "5"
log = "0.4"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
which = "6"
futures-util = "0.3"
tokio-tungstenite = "0.24"
percent-encoding = "2"
getrandom = "0.3"
base64 = "0.22"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
