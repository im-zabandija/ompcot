name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows x64 release
    runs-on: windows-2022

    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_HTTP_CHECK_REVOKE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-Windows-X64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-Windows-X64-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build OMP extensions bundle
        run: bun run build:extensions

      # The repository currently has an invalid updater private-key/password
      # pair. Build installers without updater artifacts so a signing-secret
      # configuration error cannot discard otherwise valid NSIS/MSI packages.
      # Re-enable updater artifacts only after installing a matching Tauri
      # private key in GitHub Actions and updating the public key in
      # src-tauri/tauri.conf.json.
      - name: Build Windows installers and publish assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "v__VERSION__"
          releaseName: "Ompcot v__VERSION__"
          releaseBody: |
            Automated Windows release for this version.
            Download the NSIS or MSI installer from the assets below.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: >-
            --target x86_64-pc-windows-msvc
            --bundles nsis,msi
            --config src-tauri/tauri.ci-unsigned.conf.json
          includeUpdaterJson: false
