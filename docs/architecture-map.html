<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ompcot — Mapa de arquitectura</title>
<style>
  :root{
    --bg:#15151a; --grid:#212129; --ink:#e7e7ea; --muted:#9a9aa6;
    --card:#1e1e25; --card-border:#33333f; --shadow:0 6px 20px rgba(0,0,0,.45);
    --c1:#e5534b; --c2:#e0883c; --c3:#d9c24e; --c4:#4ca362; --c5:#3d9ed6; --c6:#9a6dd7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #viewport{position:fixed;inset:0;cursor:grab;
    background-image:radial-gradient(var(--grid) 1px,transparent 1px);
    background-size:28px 28px;background-position:0 0}
  #viewport.grabbing{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .node{position:absolute;border-radius:12px;overflow:hidden}
  .group{border:2px solid var(--gc,var(--card-border));background:color-mix(in srgb,var(--gc,#888) 9%,transparent);z-index:1}
  .group>.label{position:absolute;top:-2px;left:-2px;padding:5px 12px;font-weight:650;font-size:14px;
    color:#fff;background:var(--gc,#555);border-radius:12px 0 12px 0;letter-spacing:.2px}
  .card{background:var(--card);border:1px solid var(--cc,var(--card-border));box-shadow:var(--shadow);
    padding:12px 14px;z-index:3;border-left-width:4px}
  .card.linkable{cursor:pointer;transition:transform .08s ease,box-shadow .12s ease}
  .card.linkable:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.55)}
  .card .ftitle{font-weight:650;font-size:15px;display:flex;align-items:center;gap:8px}
  .card .ftitle .ic{opacity:.85}
  .card .sub{color:var(--muted);font-size:12px;margin-top:3px;word-break:break-all}
  .card h1{font-size:19px;margin:.1em 0 .25em} .card h2{font-size:16px;margin:.2em 0} .card h3{font-size:14px;margin:.2em 0;color:var(--muted)}
  .card code{background:#2a2a33;padding:1px 5px;border-radius:5px;font-size:.9em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .card a{color:#74b9e8}
  .card.text{font-size:13px}
  svg#edges{position:absolute;left:0;top:0;overflow:visible;z-index:2;pointer-events:none}
  svg#edges path{fill:none;stroke-width:2.5;opacity:.85}
  #bar{position:fixed;top:14px;left:14px;display:flex;gap:6px;z-index:10;align-items:center}
  #bar .title{font-weight:700;margin-right:8px;background:#0009;padding:6px 12px;border-radius:9px;backdrop-filter:blur(6px)}
  #bar button{width:34px;height:34px;border:1px solid var(--card-border);background:#1e1e25cc;color:var(--ink);
    border-radius:9px;font-size:17px;cursor:pointer;backdrop-filter:blur(6px)}
  #bar button:hover{background:#2a2a33}
  #hint{position:fixed;bottom:12px;right:14px;color:var(--muted);font-size:12px;z-index:10;
    background:#0009;padding:5px 10px;border-radius:8px}
</style>
</head>
<body>
<div id="bar">
  <span class="title" id="bartitle">Canvas</span>
  <button id="zin" title="Acercar">+</button>
  <button id="zout" title="Alejar">−</button>
  <button id="fit" title="Ajustar a pantalla">⤢</button>
</div>
<div id="viewport"><div id="world"></div></div>
<div id="hint">Arrastrá para mover · rueda para zoom · click en tarjetas con ↗ abre el archivo real</div>

<script>
/* ============================================================

   ============================================================ */
const CANVAS = {

    {"id":"g-rust","type":"group","x":0,"y":0,"width":560,"height":1080,"color":"5","label":"🦀 Rust Host — src-tauri/"},
    {"id":"main-rs","type":"text","x":20,"y":90,"width":520,"height":170,"color":"5",
     "text":"**main.rs**\nEntry point (1099L). Registra plugins Tauri (dialog/shell/fs/updater/process/log), crea `OmpManager` + `BrokerWs`, y `install_control_handler` mapea 18 comandos `broker_control`. Crea/cierra ventanas y mata procesos al cerrar. Es lo primero que corre al abrir la app.",
     "url":"../src-tauri/src/main.rs"},
    {"id":"omp-manager-rs","type":"text","x":20,"y":284,"width":520,"height":170,"color":"5",

     "url":"../src-tauri/src/omp_manager.rs"},
    {"id":"broker-ws-rs","type":"text","x":20,"y":478,"width":520,"height":170,"color":"5",

    {"id":"cargo-toml","type":"text","x":20,"y":672,"width":520,"height":170,"color":"5",
     "text":"**Cargo.toml + capabilities/**\nDependencias Rust y permisos. Plugins instalados: dialog/fs/shell/updater/process/log. NO instalados (los agrega la Fase 5): notification, global-shortcut, tray-icon, single-instance, window-state.",

     "url":"../src-tauri/tauri.conf.json"},

    {"id":"g-ext","type":"group","x":620,"y":0,"width":560,"height":886,"color":"4","label":"🔌 Extensión embebida — extensions/"},
    {"id":"embedded-server-ts","type":"text","x":640,"y":90,"width":520,"height":170,"color":"4",
     "text":"**embedded-server.ts**\n3112L — el archivo más grande. Corre DENTRO de cada omp (`--extension`). Sirve la página + REST `/api/*` (sessions, cost, files, search) + WS `/ws` (RPC del chat). 🐛 Fase 1 limpia acá una rama muerta y logging ruidoso.",
     "url":"../extensions/embedded-server.ts"},
    {"id":"cost-dashboard-data-ts","type":"text","x":640,"y":284,"width":520,"height":170,"color":"4",

    {"id":"session-search-ts","type":"text","x":640,"y":478,"width":520,"height":170,"color":"4",

    {"id":"app-js","type":"text","x":640,"y":1126,"width":520,"height":170,"color":"2",

     "text":"**session-sidebar.js**\n902L: la barra lateral de sesiones agrupadas por proyecto, con favoritos/archivados/no-leídos, búsqueda y paginación.",

    {"id":"folder-picker-js","type":"text","x":1260,"y":866,"width":520,"height":170,"color":"3",
     "text":"**folder-picker.js**\nEl modal para elegir carpeta usando el picker nativo del sistema (vía transport).",

    {"id":"cost-dashboard-frontend","type":"text","x":1260,"y":1060,"width":520,"height":170,"color":"3",
     "text":"**cost.js / cost-infobar.js / cost.html / cost.css**\nEl dashboard de costos: KPIs, gráficos y desglose por modelo/proyecto. `cost.css` tiene ~150L de estilo viejo muerto que borra la Fase 1.",
     "url":"../public/cost-infobar.js"},

    {"id":"g-render","type":"group","x":1240,"y":1424,"width":560,"height":1274,"color":"6","label":"🎨 Frontend — render, temas & settings"},
    {"id":"message-renderer-js","type":"text","x":1260,"y":1514,"width":520,"height":170,"color":"6",
     "text":"**message-renderer.js**\n387L: arma las burbujas de usuario y asistente, los bloques de pensamiento colapsables, el markdown en streaming y el resaltado de búsqueda.",

    {"id":"tool-card-js","type":"text","x":1260,"y":1708,"width":520,"height":170,"color":"6",
     "text":"**tool-card.js**\n374L: las tarjetas de herramientas. El visor de diff hoy es NAIVE (borra todo/agrega todo); la Fase 1 lo cambia por un diff línea a línea de verdad.",

    {"id":"markdown-js","type":"text","x":1260,"y":1902,"width":520,"height":170,"color":"6",
     "text":"**markdown.js + vendor/remend.js**\n351L: renderer de markdown propio, sin dependencias. `remend.js` cierra la sintaxis incompleta mientras el texto llega en streaming.",

    {"id":"themes-js","type":"text","x":1260,"y":2096,"width":520,"height":170,"color":"6",

    {"id":"settings-editors-js","type":"text","x":1260,"y":2290,"width":520,"height":170,"color":"6",
     "text":"**app-settings-editors.js + app-settings-toggles.js**\nEl panel de ajustes: claves de API, editores de config/modelos, y los toggles de auto-compact / pensamiento.",

    {"id":"style-css","type":"text","x":1260,"y":2484,"width":520,"height":170,"color":"6",
     "text":"**style.css**\n5507L — el look 'Dark Glassmorphism' con ~15 animaciones. Ya respeta `prefers-reduced-motion` y `prefers-reduced-transparency`. Acá vive casi todo lo visual.",
     "url":"../public/style.css"},

    {"id":"g-config","type":"group","x":1860,"y":0,"width":560,"height":1080,"color":"1","label":"⚙️ Config, utilidades & docs"},
    {"id":"pkg-json","type":"text","x":1880,"y":90,"width":520,"height":170,"color":"1",
     "text":"**package.json + biome.json + vitest.config.js**\nHerramientas: Bun (no npm), Biome para lint/formato, Vitest para tests. 9 deps de producción, 5 de desarrollo.",
     "url":"../package.json"},
    {"id":"agents-md","type":"text","x":1880,"y":284,"width":520,"height":170,"color":"1",
     "text":"**AGENTS.md**\nLas reglas de la casa: no crecer app.js, usar solo Bun, correr `check:rust` después de tocar Rust. Leélo antes de tocar nada.",
     "url":"../AGENTS.md"},
    {"id":"roadmap-md","type":"text","x":1880,"y":478,"width":520,"height":170,"color":"1",
     "text":"**ROADMAP.md**\nRoadmap propio en español, ordenado por urgencia (Hecho / Ahora / Después / Ideas). Se deriva de BACKLOG.md.",
     "url":"../ROADMAP.md"},
    {"id":"ui-utils","type":"text","x":1880,"y":672,"width":520,"height":170,"color":"1",
     "text":"**6 utilidades UI chicas**\n`layout-insets`, `history-scroll-anchor`, `new-session-refresh`, `onboarding-state`, `package-install-status`, `session-routing` (<100L c/u): piezas de apoyo del frontend."},
    {"id":"tests-summary","type":"text","x":1880,"y":866,"width":520,"height":170,"color":"1",
     "text":"**Tests (Vitest + jsdom)**\n21 `*.test.js` en public/ + 4 `*.test.ts` en extensions/. Sin tests todavía: app.js, themes.js, tool-card.js, dialogs.js, file-browser.js."},

    {"id":"g-recipes","type":"group","x":2480,"y":0,"width":560,"height":1468,"color":"3","label":"🧑‍🍳 ¿Qué toco para...? — recetario"},
    {"id":"recipe-colors","type":"text","x":2500,"y":90,"width":520,"height":170,"color":"3",
     "text":"**🎨 ¿Cambiar colores o crear tu tema?**\nLos colores están en `public/style-theme.css` y la lista en `public/themes.js`. Lo más simple: copiá un bloque de tema y cambiá los hex. La Fase 4 agrega un selector de color sin tocar código.",
     "url":"../public/style-theme.css"},
    {"id":"recipe-window","type":"text","x":2500,"y":284,"width":520,"height":170,"color":"3",
     "text":"**🪟 ¿Cambiar la ventana?**\nEso es backend (Rust): `src-tauri/tauri.conf.json` tiene los tamaños por defecto y `src-tauri/src/main.rs` (buscá `open_workspace_window`) crea cada ventana.",
     "url":"../src-tauri/src/main.rs"},
    {"id":"recipe-chat-look","type":"text","x":2500,"y":478,"width":520,"height":170,"color":"3",
     "text":"**💬 ¿Cambiar cómo se ve el chat?**\nEso es frontend: `public/message-renderer.js` arma las burbujas, `public/tool-card.js` las tarjetas de herramientas y `public/style.css` el aspecto de todo.",
     "url":"../public/message-renderer.js"},
    {"id":"recipe-new-button","type":"text","x":2500,"y":672,"width":520,"height":170,"color":"3",
     "text":"**🧰 ¿Agregar un botón o función?**\nEl HTML está en `public/index.html` (ahí ponés el botón) y la lógica del click en `public/app.js` (o el módulo que corresponda tras la Fase 3).",
     "url":"../public/index.html"},
    {"id":"recipe-startup","type":"text","x":2500,"y":866,"width":520,"height":170,"color":"3",
     "text":"**⚙️ ¿Cambiar qué hace al arrancar?**\nBackend puro: la función `main()` en `src-tauri/src/main.rs` decide qué carpeta abrir, qué omp levantar y qué ventana mostrar primero.",
     "url":"../src-tauri/src/main.rs"},
    {"id":"recipe-debug","type":"text","x":2500,"y":1060,"width":520,"height":170,"color":"3",
     "text":"**🐛 ¿Algo raro? ¿Por dónde miro?**\nSi es visual/en pantalla → DevTools del navegador (clic derecho > Inspeccionar) y mirá la consola. Si no arranca o falla un proceso → los logs de la terminal (`bun run dev`)."},
    {"id":"recipe-fork","type":"text","x":2500,"y":1254,"width":520,"height":170,"color":"3",
     "text":"**🍴 ¿Cómo armo mi propio Ompcot?**\nNo hace falta reescribir: editá los archivos de arriba en tu copia, corré `bun run dev` y cada cambio se ve al recargar. La Fase 4 vuelve muchas de estas opciones parte de Ajustes."}
  ],
  "edges": [
    {"id":"e1","fromNode":"omp-manager-rs","toNode":"embedded-server-ts","fromSide":"right","toSide":"left","color":"4","label":"spawnea omp --extension embedded-server.mjs"},
    {"id":"e2","fromNode":"broker-ws-rs","toNode":"transport-js","fromSide":"right","toSide":"left","color":"2","label":"broker_control sobre WS loopback"},
    {"id":"e3","fromNode":"embedded-server-ts","toNode":"websocket-client-js","fromSide":"bottom","toSide":"top","color":"4","label":"HTTP /api/* + WS /ws (RPC)"},
    {"id":"e4","fromNode":"app-js","toNode":"session-sidebar-js","fromSide":"right","toSide":"left","color":"3","label":"orquesta (16 imports)"},
    {"id":"e5","fromNode":"app-js","toNode":"themes-js","fromSide":"right","toSide":"left","color":"6","label":"orquesta temas/settings"}
  ]
};
const TITLE = "Ompcot — Mapa de arquitectura";

/* ============================== motor ============================== */
const PAL = {"1":"--c1","2":"--c2","3":"--c3","4":"--c4","5":"--c5","6":"--c6"};
const col = c => !c ? null : (PAL[c] ? `var(${PAL[c]})` : c);
const world = document.getElementById('world');
const vp = document.getElementById('viewport');
document.getElementById('bartitle').textContent = TITLE;
document.title = TITLE;

function mdEsc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(src){
  return mdEsc(src)
    .replace(/^### (.*)$/gm,'<h3>$1</h3>')
    .replace(/^## (.*)$/gm,'<h2>$1</h2>')
    .replace(/^# (.*)$/gm,'<h1>$1</h1>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');
}
const byId = {};
const NS='http://www.w3.org/2000/svg';
const svg = document.createElementNS(NS,'svg'); svg.id='edges';
svg.innerHTML = '<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"></path></marker></defs>';
world.appendChild(svg);

for(const n of CANVAS.nodes){
  byId[n.id]=n;
  const el=document.createElement('div');
  el.className=`node ${n.type==='group'?'group':`card ${n.type}`}`;
  el.style.left=`${n.x}px`; el.style.top=`${n.y}px`; el.style.width=`${n.width}px`; el.style.height=`${n.height}px`;
  const c=col(n.color);
  if(n.type==='group'){
    if(c) el.style.setProperty('--gc',c);
    el.innerHTML=`<div class="label">${mdEsc(n.label||'')}</div>`;
  } else {
    if(c) el.style.setProperty('--cc',c);
    if(n.type==='text'){ el.innerHTML=md(n.text||''); }
    else if(n.type==='file'){
      const name=(n.file||'').split('/').pop().replace(/\.md$/,'');
      el.innerHTML='<div class="ftitle"><span class="ic">📄</span>'+mdEsc(name)+(n.url?' <span class="ic">↗</span>':'')+'</div>'+
        (n.subpath?`<div class="sub">${mdEsc(n.subpath)}</div>`:'');
    } else if(n.type==='link'){
      let host=n.url||''; try{host=new URL(n.url).hostname.replace(/^www\./,'')}catch(e){}
      el.innerHTML='<div class="ftitle"><span class="ic">🌐</span>'+mdEsc(n.label||host)+' <span class="ic">↗</span></div>'+
        '<div class="sub">'+mdEsc(n.url||'')+'</div>';
    }
    if(n.url){ el.classList.add('linkable'); el.addEventListener('click',e=>{ if(!dragMoved){ window.open(n.url,'_blank','noopener'); } }); }
  }
  world.appendChild(el);
}

function anchor(n,side){
  const cx=n.x+n.width/2, cy=n.y+n.height/2;
  if(side==='top')return[cx,n.y,0,-1];
  if(side==='bottom')return[cx,n.y+n.height,0,1];
  if(side==='left')return[n.x,cy,-1,0];
  if(side==='right')return[n.x+n.width,cy,1,0];
  return[cx,cy,0,0];
}
for(const e of CANVAS.edges){
  const a=byId[e.fromNode], b=byId[e.toNode]; if(!a||!b)continue;
  const [ax,ay,anx,any]=anchor(a,e.fromSide||'bottom');
  const [bx,by,bnx,bny]=anchor(b,e.toSide||'top');
  const d=Math.hypot(bx-ax,by-ay), k=Math.max(45,d*0.4);
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',`M ${ax} ${ay} C ${ax+anx*k} ${ay+any*k}, ${bx+bnx*k} ${by+bny*k}, ${bx} ${by}`);
  p.setAttribute('stroke',col(e.color)||'#5a5a68');
  if(e.toEnd!=='none') p.setAttribute('marker-end','url(#arr)');
  svg.appendChild(p);
  if(e.label){
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',(ax+bx)/2); t.setAttribute('y',(ay+by)/2-6);
    t.setAttribute('fill','#cfcfd6'); t.setAttribute('font-size','12'); t.setAttribute('text-anchor','middle');
    t.textContent=e.label; svg.appendChild(t);
  }
}

/* pan + zoom */
let scale=1,tx=0,ty=0,dragging=false,sx=0,sy=0,dragMoved=false;
function apply(){ world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }
function fitToContent(){
  const xs=CANVAS.nodes.map(n=>n.x), ys=CANVAS.nodes.map(n=>n.y);
  const xe=CANVAS.nodes.map(n=>n.x+n.width), ye=CANVAS.nodes.map(n=>n.y+n.height);
  const minX=Math.min(...xs),minY=Math.min(...ys),maxX=Math.max(...xe),maxY=Math.max(...ye);
  const w=maxX-minX,h=maxY-minY,pad=80;
  scale=Math.min((innerWidth-pad*2)/w,(innerHeight-pad*2)/h,1.4);
  tx=(innerWidth-w*scale)/2-minX*scale; ty=(innerHeight-h*scale)/2-minY*scale; apply();
}
vp.addEventListener('mousedown',e=>{dragging=true;dragMoved=false;sx=e.clientX;sy=e.clientY;vp.classList.add('grabbing');});
addEventListener('mousemove',e=>{ if(!dragging)return; const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)+Math.abs(dy)>3)dragMoved=true; tx+=dx;ty+=dy;sx=e.clientX;sy=e.clientY;apply(); });
addEventListener('mouseup',()=>{dragging=false;vp.classList.remove('grabbing');});
vp.addEventListener('wheel',e=>{ e.preventDefault();
  const f=e.deltaY<0?1.12:1/1.12, ns=Math.min(3,Math.max(0.15,scale*f));
  const wx=(e.clientX-tx)/scale, wy=(e.clientY-ty)/scale;
  tx=e.clientX-wx*ns; ty=e.clientY-wy*ns; scale=ns; apply();
},{passive:false});
document.getElementById('zin').onclick=()=>{scale=Math.min(3,scale*1.2);apply();};
document.getElementById('zout').onclick=()=>{scale=Math.max(0.15,scale/1.2);apply();};
document.getElementById('fit').onclick=fitToContent;
addEventListener('resize',fitToContent);
fitToContent();
</script>
